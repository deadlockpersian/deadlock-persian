<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- deadlock-persian: Vazirmatn for Persian (Arabic-script) UI text. -->
<fontconfig>
    <!-- The engine only loads font files whose name matches a fontpattern.
         Whitelist the Vazirmatn file names (case/extension variants). -->
    <fontpattern>Vazirmatn</fontpattern>
    <fontpattern>vazirmatn</fontpattern>
    <fontpattern>Vazirmatn-Regular</fontpattern>
    <fontpattern>Vazirmatn-Bold</fontpattern>
    <fontpattern>vazirmatn-regular</fontpattern>
    <fontpattern>vazirmatn-bold</fontpattern>
    <fontpattern>Vazirmatn-Regular.ttf</fontpattern>
    <fontpattern>Vazirmatn-Bold.ttf</fontpattern>
    <!-- Every font request also lists Vazirmatn. For Persian/Arabic-script
         text the game's own fonts have no glyph coverage, so rendering falls
         to Vazirmatn; Latin and symbols keep using the game's fonts. -->
    <match>
        <edit name="family" mode="append">
            <string>Vazirmatn</string>
        </edit>
    </match>
    <!-- If a request does carry an Arabic charset, prefer Vazirmatn first. -->
    <match>
        <test qual="any" name="charset" compare="contains">
            <string>Arabic</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Vazirmatn</string>
        </edit>
    </match>
</fontconfig>

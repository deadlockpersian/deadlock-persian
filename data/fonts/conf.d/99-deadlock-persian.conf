<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<!-- deadlock-persian: Vazirmatn for Persian (Arabic-script) UI text. -->
<!-- Rule format mirrors the game's own 42-repl-global.conf template and the -->
<!-- CS2FontStudio/EBFM font tools: target=font reassigns the family in the -->
<!-- font cache; target=pattern prepends Vazirmatn with strong binding so it -->
<!-- wins the family match. Marlett and *.uifont symbol fonts are left alone. -->
<fontconfig>
    <!-- The engine only loads font files whose name matches a fontpattern. -->
    <fontpattern>Vazirmatn</fontpattern>
    <fontpattern>vazirmatn</fontpattern>
    <fontpattern>Vazirmatn-Regular</fontpattern>
    <fontpattern>Vazirmatn-Bold</fontpattern>
    <fontpattern>vazirmatn-regular</fontpattern>
    <fontpattern>vazirmatn-bold</fontpattern>
    <fontpattern>Vazirmatn-Regular.ttf</fontpattern>
    <fontpattern>Vazirmatn-Bold.ttf</fontpattern>
    <!-- Vazirmatn replaces the game text fonts (42-repl-global style). -->
    <match target="font">
        <test name="family" compare="contains" qual="any"><string>Radiance</string></test>
        <edit name="family" mode="assign"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Radiance</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="font">
        <test name="family" compare="contains" qual="any"><string>Reaver</string></test>
        <edit name="family" mode="assign"><string>Vazirmatn</string></edit>

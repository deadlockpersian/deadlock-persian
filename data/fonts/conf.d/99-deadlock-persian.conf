<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- deadlock-persian: Vazirmatn for Persian (Arabic-script) UI text. -->
<fontconfig>
    <!-- The engine only loads font files whose name matches a fontpattern
         ("Both file name and font name work, but devs recommend file name"). -->
    <fontpattern>Vazirmatn</fontpattern>
    <fontpattern>vazirmatn</fontpattern>
    <fontpattern>Vazirmatn-Regular</fontpattern>
    <fontpattern>Vazirmatn-Bold</fontpattern>
    <fontpattern>vazirmatn-regular</fontpattern>
    <fontpattern>vazirmatn-bold</fontpattern>
    <fontpattern>Vazirmatn-Regular.ttf</fontpattern>
    <fontpattern>Vazirmatn-Bold.ttf</fontpattern>
    <!-- Vazirmatn replaces the game text fonts (42-repl-global style): for
         requests of these families, Vazirmatn is prepended with strong
         binding so it wins the family match. Persian (Arabic-script) text
         then renders in Vazirmatn; the game's fonts carry no Arabic glyphs.
         Marlett and *.uifont symbol fonts are intentionally left alone. -->
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Radiance</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Reaver</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Valve</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Jost</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Hahmlet</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Hans</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>RocknRoll</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Tetsubin</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Retail</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Hypatia</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Noto</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Arial</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Tahoma</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Verdana</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>DejaVu</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Liberation</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Courier</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Lucida</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>Gulim</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test name="family" compare="contains" qual="any"><string>MingLiU</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <test qual="any" name="charset" compare="contains"><string>Arabic</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
    </match>
    <match target="pattern">
        <edit name="family" mode="append"><string>Vazirmatn</string></edit>
    </match>
</fontconfig>
